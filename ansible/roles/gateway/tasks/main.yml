- name: install packages
  apt: {name: [nginx, python3-venv, rsync], state: present, update_cache: true}
- name: sync gateway service
  synchronize: {src: ../../../../gateway/, dest: /opt/gateway/}
- name: nginx site
  template: {src: gateway.conf.j2, dest: /etc/nginx/sites-available/gateway}
  notify: reload nginx
- name: restart gateway
  systemd: {name: gateway, state: restarted, daemon_reload: true}
